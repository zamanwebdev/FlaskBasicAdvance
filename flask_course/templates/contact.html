<!DOCTYPE html>
<html>
<head>
    <title>Contact</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <div class="container mt-5">
    <h1 class="text-center">Contact Us</h1>

    <form method="POST" class="shadow p-4 bg-white rounded">
        <input type="text" name="username" class="form-control mb-3" placeholder="Enter your name">
        <input type="email" name="email" class="form-control mb-3" placeholder="Enter your email">
        <button type="submit" class="btn btn-success w-100">Send</button><br>
    </form>
        <a class="btn btn-success w-100" href="/">Back to Home</a>

</div>

</body>
</html>
